<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>嘉訊・知識圖譜｜115年1–9月</title>
<meta name="description" content="115年1至9月刊物文章知識圖譜、MiniSearch全文搜尋與原文閱讀">
<script src="https://cdn.jsdelivr.net/npm/minisearch@7.1.2/dist/umd/index.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.4/dist/cytoscape.min.js"></script>
<style>
:root{--bg:#07111f;--panel:#0d1b2b;--panel2:#10243a;--line:#24445f;--text:#eaf4ff;--muted:#8eabc4;--cyan:#52d6ff;--gold:#ffd166;--violet:#b59cff;--green:#7ce3aa;--danger:#ff8c8c}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:ui-sans-serif,system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:radial-gradient(circle at 15% 10%,#123352 0,#07111f 34%,#040b14 100%);color:var(--text)}
body{overflow:hidden}.app{height:100vh;display:grid;grid-template-rows:auto 1fr}
header{padding:18px 22px 14px;border-bottom:1px solid #18344d;background:rgba(4,12,22,.88);backdrop-filter:blur(12px);z-index:5}
.brandrow{display:flex;gap:18px;align-items:flex-end;justify-content:space-between}.brand h1{margin:0;font-size:25px;letter-spacing:.08em}.brand p{margin:5px 0 0;color:var(--muted);font-size:13px}
.searchwrap{width:min(560px,58vw);position:relative}.searchwrap input{width:100%;padding:12px 44px 12px 15px;border-radius:14px;border:1px solid #2b5775;background:#091827;color:#fff;font-size:15px;outline:none;box-shadow:0 0 0 0 rgba(82,214,255,0)}.searchwrap input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(82,214,255,.12)}.searchwrap span{position:absolute;right:15px;top:10px;font-size:20px;color:var(--cyan)}
.main{min-height:0;display:grid;grid-template-columns:265px 1fr 390px;gap:0}.sidebar,.detail{background:rgba(9,24,39,.83);backdrop-filter:blur(10px);overflow:auto}.sidebar{border-right:1px solid #19364e;padding:18px}.detail{border-left:1px solid #19364e;padding:20px}
.graph{position:relative;min-width:0}.graph #cy{position:absolute;inset:0}.graphHelp{position:absolute;left:15px;bottom:15px;background:rgba(5,14,24,.85);border:1px solid #24445f;padding:9px 12px;border-radius:12px;color:var(--muted);font-size:12px;pointer-events:none}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:#8fb2cb;margin:0 0 10px}.section{margin-bottom:22px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid #28506c;background:#0b1a29;color:#cde7fb;border-radius:999px;padding:6px 10px;font-size:12px;cursor:pointer}.chip:hover,.chip.active{border-color:var(--cyan);color:#fff;background:#12304a}.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat div{background:#0b1a29;border:1px solid #1d3b52;border-radius:12px;padding:10px}.stat b{display:block;font-size:21px;color:#fff}.stat small{color:var(--muted)}
.legend{display:grid;gap:8px;color:var(--muted);font-size:12px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px}.articleTitle{font-size:23px;line-height:1.35;margin:6px 0 10px}.meta{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.badge{font-size:12px;border:1px solid #31556e;background:#0a1826;border-radius:999px;padding:5px 8px;color:#cfeaff}.excerpt{color:#b9cede;line-height:1.75;font-size:14px;border-top:1px solid #1c3950;padding-top:14px}.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.btn{border:1px solid #3f7292;background:#112a40;color:#fff;border-radius:10px;padding:9px 12px;cursor:pointer;font-weight:700}.btn.primary{background:linear-gradient(135deg,#37c4ee,#6b8cff);border:0;color:#03101a}.btn:hover{filter:brightness(1.08)}.searchResults{position:absolute;z-index:20;top:48px;left:0;right:0;max-height:56vh;overflow:auto;background:#091827;border:1px solid #315c7a;border-radius:14px;box-shadow:0 18px 55px rgba(0,0,0,.48);display:none}.result{padding:11px 13px;border-bottom:1px solid #16364e;cursor:pointer}.result:hover{background:#112b40}.result b{display:block;font-size:14px}.result small{color:#8fabc0}
.reader{position:fixed;inset:0;background:rgba(1,7,13,.78);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:4vh 18px;overflow:auto;backdrop-filter:blur(8px)}.reader.open{display:flex}.paper{width:min(920px,96vw);min-height:90vh;background:#fbfaf7;color:#202224;border-radius:18px;box-shadow:0 24px 80px rgba(0,0,0,.55);overflow:hidden}.paperTop{position:sticky;top:0;background:rgba(251,250,247,.96);backdrop-filter:blur(8px);padding:16px 24px;border-bottom:1px solid #dedbd4;display:flex;justify-content:space-between;gap:12px;align-items:center;z-index:2}.paperBody{max-width:760px;margin:auto;padding:40px 34px 80px}.paperBody h1{font-family:serif;font-size:34px;line-height:1.38;margin:0 0 10px;color:#18232c}.paperMeta{color:#68737c;font-size:14px;border-bottom:1px solid #ddd8ce;padding-bottom:18px;margin-bottom:28px}.paperText{font-family:serif;font-size:19px;line-height:2.05;letter-spacing:.025em;white-space:pre-wrap}.paperTags{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.paperTags span{font-family:ui-sans-serif,system-ui;font-size:12px;background:#eef4f6;border-radius:999px;padding:5px 8px;color:#48606c}.close{background:#1b2a34;color:white;border:0;border-radius:9px;padding:8px 11px;cursor:pointer}.pdfLink{color:#0f668c;text-decoration:none;font-weight:700}
.loading{color:var(--muted)}
@media(max-width:1050px){.main{grid-template-columns:220px 1fr 320px}.searchwrap{width:48vw}}
@media(max-width:800px){body{overflow:auto}.app{height:auto;min-height:100vh}.brandrow{align-items:stretch;flex-direction:column}.searchwrap{width:100%}.main{display:block}.sidebar{border-right:0}.graph{height:62vh}.detail{border-left:0;border-top:1px solid #19364e;min-height:350px}.paperBody{padding:28px 20px 60px}.paperBody h1{font-size:27px}.paperText{font-size:18px;line-height:1.95}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brandrow">
    <div class="brand"><h1>嘉訊・知識圖譜</h1><p>115年1–9月｜文章級 JSON・MiniSearch 全文搜尋・原文閱讀</p></div>
    <div class="searchwrap"><input id="q" placeholder="搜尋：AI、潤滑油、圖書館、薪傳、作者…" autocomplete="off"><span>⌕</span><div id="results" class="searchResults"></div></div>
  </div>
</header>
<div class="main">
  <aside class="sidebar">
    <div class="section"><h2>資料概況</h2><div class="stat"><div><b id="articleCount">—</b><small>篇文章</small></div><div><b>9</b><small>個月份</small></div></div></div>
    <div class="section"><h2>月份</h2><div id="months" class="chips"></div></div>
    <div class="section"><h2>主題</h2><div id="topics" class="chips"></div></div>
    <div class="section"><h2>圖例</h2><div class="legend"><div><i class="dot" style="background:#52d6ff"></i>文章</div><div><i class="dot" style="background:#ffd166"></i>知識主題</div><div><i class="dot" style="background:#b59cff"></i>月份／期別</div></div></div>
    <button class="btn" id="reset">重設篩選</button>
  </aside>
  <main class="graph"><div id="cy"></div><div class="graphHelp">點文章節點 → 右側摘要 →「閱讀全文」<br>拖曳節點、滾輪縮放皆可</div></main>
  <aside class="detail" id="detail"><div class="loading">載入資料中…</div></aside>
</div>
</div>

<div class="reader" id="reader">
  <article class="paper">
    <div class="paperTop"><div><b>原文閱讀模式</b></div><button class="close" id="closeReader">關閉 ✕</button></div>
    <div class="paperBody" id="paperBody"></div>
  </article>
</div>

<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let manifest=[], articles=new Map(), mini, cy, activeMonth='', activeTopic='';

async function boot(){
  manifest=await fetch('manifest.json').then(r=>r.json());
  document.querySelector('#articleCount').textContent=manifest.length;
  const docs=await Promise.all(manifest.map(async m=>{
    const a=await fetch(m.file.replace(/^articles\//,'')).then(r=>r.json()); articles.set(a.id,a);
    return {id:a.id,title:a.title,author:a.author,month:a.month,issue:String(a.issue),topics:a.topics.join(' '),content:a.content};
  }));
  mini=new MiniSearch({fields:['title','author','month','issue','topics','content'],storeFields:['id','title','author','month','issue','topics'],searchOptions:{boost:{title:7,author:4,topics:4},prefix:true,fuzzy:0.2,combineWith:'OR'}});
  mini.addAll(docs);
  buildFilters(); buildGraph();
  const p=new URLSearchParams(location.search).get('article');
  if(p && articles.has(p)){focusArticle(p);openReader(p,false)}
  else if(manifest[0]) showDetail(manifest[0].id);
}
function buildFilters(){
  const ms=[...new Set(manifest.map(x=>x.month))];
  months.innerHTML=ms.map(m=>`<button class="chip" data-month="${m}">${m}</button>`).join('');
  months.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{activeMonth=activeMonth===b.dataset.month?'':b.dataset.month;applyFilters();paintFilters()});
  const counts={}; manifest.forEach(a=>a.topics.forEach(t=>counts[t]=(counts[t]||0)+1));
  const ts=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  topics.innerHTML=ts.map(([t,c])=>`<button class="chip" data-topic="${esc(t)}">${esc(t)} ${c}</button>`).join('');
  topics.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{activeTopic=activeTopic===b.dataset.topic?'':b.dataset.topic;applyFilters();paintFilters()});
}
function paintFilters(){
  document.querySelectorAll('[data-month]').forEach(b=>b.classList.toggle('active',b.dataset.month===activeMonth));
  document.querySelectorAll('[data-topic]').forEach(b=>b.classList.toggle('active',b.dataset.topic===activeTopic));
}
function buildGraph(){
 const elements=[], topicSet=new Set(), monthSet=new Set();
 manifest.forEach(a=>{a.topics.forEach(t=>topicSet.add(t));monthSet.add(a.month)});
 [...monthSet].forEach(m=>elements.push({data:{id:'m:'+m,label:m,type:'month'}}));
 [...topicSet].forEach(t=>elements.push({data:{id:'t:'+t,label:t,type:'topic'}}));
 manifest.forEach(a=>{
   elements.push({data:{id:a.id,label:a.title,type:'article',month:a.month}});
   elements.push({data:{id:'em:'+a.id,source:'m:'+a.month,target:a.id,type:'monthEdge'}});
   a.topics.forEach((t,i)=>elements.push({data:{id:'et:'+a.id+':'+i,source:a.id,target:'t:'+t,type:'topicEdge'}}));
 });
 cy=cytoscape({container:document.querySelector('#cy'),elements,
 style:[
 {selector:'node',style:{'label':'data(label)','font-family':'system-ui','font-size':10,'color':'#dfefff','text-wrap':'wrap','text-max-width':110,'text-valign':'center','text-halign':'center','border-width':1,'border-color':'#294f69'}},
 {selector:'node[type="article"]',style:{'background-color':'#52d6ff','width':28,'height':28,'color':'#cceeff','text-margin-y':16}},
 {selector:'node[type="topic"]',style:{'background-color':'#ffd166','width':36,'height':36,'color':'#ffe9a6','text-margin-y':18}},
 {selector:'node[type="month"]',style:{'background-color':'#b59cff','width':42,'height':42,'font-size':12,'font-weight':'bold','color':'#e8ddff','text-margin-y':20}},
 {selector:'edge',style:{'width':1,'line-color':'#24445f','curve-style':'bezier','opacity':.58}},
 {selector:'edge[type="monthEdge"]',style:{'line-color':'#6b5e9c','opacity':.38}},
 {selector:':selected',style:{'border-width':4,'border-color':'#ffffff'}}
 ],
 layout:{name:'cose',animate:false,idealEdgeLength:100,nodeRepulsion:9000,gravity:.35,componentSpacing:80}
 });
 cy.on('tap','node[type="article"]',e=>showDetail(e.target.id()));
 cy.on('tap','node[type="topic"]',e=>{activeTopic=e.target.data('label');applyFilters();paintFilters()});
 cy.on('tap','node[type="month"]',e=>{activeMonth=e.target.data('label');applyFilters();paintFilters()});
}
function showDetail(id){
 const a=articles.get(id); if(!a)return;
 detail.innerHTML=`<h2>文章</h2><div class="articleTitle">${esc(a.title)}</div>
 <div class="meta"><span class="badge">${esc(a.month)}・第${a.issue}期</span><span class="badge">PDF第${a.page}頁</span><span class="badge">${esc(a.author)}</span></div>
 <div class="chips">${a.topics.map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div>
 <div class="btnrow"><button class="btn primary" id="readFull">閱讀全文</button><a class="btn" target="_blank" href="11501-09.pdf#page=${a.page}">查看原版 PDF 頁面</a><button class="btn" id="copyLink">複製文章連結</button></div>
 <div class="excerpt">${esc(a.content.slice(0,560))}${a.content.length>560?'…':''}</div>`;
 document.querySelector('#readFull').onclick=()=>openReader(id,true);
 document.querySelector('#copyLink').onclick=async()=>{const u=new URL(location.href);u.search='?article='+encodeURIComponent(id);await navigator.clipboard.writeText(u.toString());document.querySelector('#copyLink').textContent='已複製 ✓'};
}
function openReader(id,push=true){
 const a=articles.get(id); if(!a)return;
 paperBody.innerHTML=`<h1>${esc(a.title)}</h1><div class="paperMeta">${esc(a.author)}　｜　115年${esc(a.month)}・第${a.issue}期　｜　原刊第${a.page}頁
 <div class="paperTags">${a.topics.map(t=>`<span>${esc(t)}</span>`).join('')}</div>
 <a class="pdfLink" target="_blank" href="11501-09.pdf#page=${a.page}">↗ 查看原版 PDF 第 ${a.page} 頁</a></div>
 <div class="paperText">${esc(a.content)}</div>`;
 reader.classList.add('open');
 if(push){const u=new URL(location.href);u.search='?article='+encodeURIComponent(id);history.pushState({article:id},'',u)}
}
closeReader.onclick=()=>{reader.classList.remove('open')};
reader.onclick=e=>{if(e.target===reader)reader.classList.remove('open')};
window.onpopstate=()=>{const id=new URLSearchParams(location.search).get('article');if(id&&articles.has(id)){showDetail(id);openReader(id,false)}else reader.classList.remove('open')};

function focusArticle(id){if(!cy)return;const n=cy.getElementById(id);cy.elements().unselect();n.select();cy.animate({center:{eles:n},zoom:1.35},{duration:400});showDetail(id)}
function applyFilters(){
 if(!cy)return;
 cy.elements().style('display','element');
 const keep=new Set(manifest.filter(a=>(!activeMonth||a.month===activeMonth)&&(!activeTopic||a.topics.includes(activeTopic))).map(a=>a.id));
 if(activeMonth||activeTopic){
   cy.nodes('[type="article"]').forEach(n=>{if(!keep.has(n.id()))n.style('display','none')});
   cy.edges().forEach(e=>{if(e.source().style('display')==='none'||e.target().style('display')==='none')e.style('display','none')});
   cy.nodes('[type="topic"],[type="month"]').forEach(n=>{if(!n.connectedEdges().some(e=>e.style('display')!=='none'))n.style('display','none')});
   const vis=cy.elements(':visible'); if(vis.length)cy.fit(vis,50);
 }else cy.fit(cy.elements(),50);
}
reset.onclick=()=>{activeMonth='';activeTopic='';paintFilters();applyFilters()};
q.addEventListener('input',()=>{
 const term=q.value.trim(); if(!term){results.style.display='none';return}
 const rs=mini.search(term,{prefix:true,fuzzy:0.2}).slice(0,18);
 results.innerHTML=rs.map(r=>`<div class="result" data-id="${r.id}"><b>${esc(r.title)}</b><small>${esc(r.month)}・${esc(r.author)}｜${esc(r.topics)}</small></div>`).join('')||'<div class="result">找不到符合內容</div>';
 results.style.display='block';
 results.querySelectorAll('[data-id]').forEach(x=>x.onclick=()=>{results.style.display='none';q.value='';focusArticle(x.dataset.id)});
});
document.addEventListener('click',e=>{if(!e.target.closest('.searchwrap'))results.style.display='none'});
boot().catch(err=>{detail.innerHTML='<h2>載入失敗</h2><div class="excerpt">'+esc(err.message)+'<br><br>請確認您是透過 GitHub Pages/HTTP 開啟，而不是直接用 file:// 開啟。</div>';console.error(err)});
</script>
</body></html>
